<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1分で世界を救え</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #1a1b32;
    --accent: #ffd166;
    --hp: #ff5d5d;
    --exp: #5dd9ff;
    --text: #eef0ff;
    --common: #9aa0b0;
    --rare: #5dd9ff;
    --epic: #c77dff;
    --legend: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  #app {
    width: 100%; height: 100vh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
    position: relative;
  }

  /* --- Start screen --- */
  #start-screen, #result-screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 24px; text-align: center; z-index: 10;
    background: var(--bg);
  }
  h1 { font-size: 1.6em; margin: 0; letter-spacing: 0.05em; }
  .sub { color: #9aa0c0; font-size: 0.9em; margin-top: -12px; }
  #best-record { color: #8b90b8; font-size: 0.8em; }
  #best-record b { color: var(--accent); }
  #new-best-tag {
    display: none; color: var(--accent); font-size: 0.85em; font-weight: bold;
    margin-top: -8px;
  }
  button.primary {
    background: var(--accent); color: #2a1d00; border: none;
    padding: 14px 36px; font-size: 1.1em; border-radius: 999px;
    font-weight: bold; cursor: pointer;
  }
  button.primary:active { transform: scale(0.97); }

  /* --- Battle screen --- */
  #battle-screen { flex: 1; display: none; flex-direction: column; padding: 16px; }
  #stage-label { text-align: center; font-size: 0.95em; color: #cfd3ff; height: 1.4em; }
  #arena {
    flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px;
  }
  .fighter { position: relative; width: 90px; text-align: center; }
  #hero { position: absolute; left: 18%; bottom: 20px; }
  #enemy { position: absolute; right: 18%; bottom: 20px; }
  .aura {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 100px; border-radius: 50%; filter: blur(14px);
    opacity: 0.55; z-index: -1;
  }
  .stick { font-size: 42px; display: block; animation: idle-bob 1.6s ease-in-out infinite; }
  @keyframes idle-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .gear-icon {
    position: absolute; top: 4px; right: -6px; font-size: 20px;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));
  }
  .name-tag { font-size: 0.7em; color: #aeb4d8; margin-top: 4px; }
  .hpbar-wrap { width: 90px; height: 8px; background: #2a2b48; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .hpbar { height: 100%; background: var(--hp); width: 100%; transition: width 0.25s linear; }
  #hero .hpbar { background: var(--exp); }
  .hit-fx {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%);
    font-size: 1.4em; font-weight: bold; color: var(--accent);
    opacity: 0; pointer-events: none;
  }
  .hit-fx.show { animation: pop var(--hitfx-dur, 0.35s) ease-out; }
  @keyframes pop {
    0% { opacity: 1; transform: translate(-50%,-50%) scale(0.6); }
    60% { opacity: 1; transform: translate(-50%,-80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-110%) scale(1.1); }
  }
  #status-bar {
    display: flex; justify-content: space-around; font-size: 0.75em; color: #b9bde8;
    padding: 8px 0; border-top: 1px solid #2a2b48;
  }
  #status-bar b { color: var(--text); }
  #timer-wrap { width: 100%; height: 5px; background: #2a2b48; border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
  #timer-bar { height: 100%; width: 100%; background: var(--accent); transition: width 0.1s linear; }

  /* --- Result screen --- */
  #result-screen { display: none; }
  #result-title { font-size: 1.5em; font-weight: bold; }
  #result-rarity { font-size: 0.9em; color: var(--accent); font-weight: bold; }
  #result-detail { color: #cfd3ff; font-size: 0.95em; line-height: 1.6; max-width: 340px; }
  #result-stats { font-size: 0.8em; color: #8b90b8; }
  .rank-common { color: var(--common); }
  .rank-rare { color: var(--rare); }
  .rank-epic { color: var(--epic); }
  .rank-legend { color: var(--legend); }
</style>
</head>
<body>
<div id="app">

  <div id="start-screen">
    <h1>1分で世界を救え</h1>
    <div class="sub">タップして今回の運命を引く</div>
    <div id="best-record">-</div>
    <button class="primary" id="start-btn">はじめる</button>
  </div>

  <div id="battle-screen">
    <div id="timer-wrap"><div id="timer-bar"></div></div>
    <div id="stage-label">-</div>
    <div id="arena">
      <div class="fighter" id="hero">
        <div class="aura" id="hero-aura"></div>
        <span class="stick" id="hero-stick">🧍</span>
        <span class="gear-icon" id="hero-gear-icon"></span>
        <div class="hit-fx" id="hero-hit">!</div>
        <div class="name-tag" id="hero-tag">勇者</div>
        <div class="hpbar-wrap"><div class="hpbar" id="hero-hp"></div></div>
      </div>
      <div class="fighter" id="enemy">
        <span class="stick" id="enemy-icon">👹</span>
        <div class="hit-fx" id="enemy-hit">!</div>
        <div class="name-tag" id="enemy-tag">-</div>
        <div class="hpbar-wrap"><div class="hpbar" id="enemy-hp"></div></div>
      </div>
    </div>
    <div id="status-bar">
      <div>才能 <b id="stat-talent">-</b></div>
      <div>運 <b id="stat-luck">-</b></div>
      <div>Lv <b id="stat-level">-</b></div>
      <div>装備 <b id="stat-gear">-</b></div>
    </div>
  </div>

  <div id="result-screen">
    <div id="result-title">-</div>
    <div id="new-best-tag">自己ベスト更新!</div>
    <div id="result-rarity">-</div>
    <div id="result-detail">-</div>
    <div id="result-stats">-</div>
    <button class="primary" id="retry-btn">もう一度運命を引く</button>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* =========================================================
   * ① 確率設計(仮値 — 実プレイで調整する前提)
   * ========================================================= */
  const TALENT_MIN = 0.5, TALENT_MAX = 3.0; // 経験値倍率レンジ
  const GEAR_TABLE = [
    { rank: "コモン",       key: "common", weight: 70, atkMul: 1.00 },
    { rank: "レア",         key: "rare",   weight: 20, atkMul: 1.3  },
    { rank: "エピック",     key: "epic",   weight: 8,  atkMul: 1.7  },
    { rank: "レジェンダリー", key: "legend", weight: 2,  atkMul: 2.4  },
  ];

  // 山型分布(三角分布)で 0.5〜3.0 の間に才能を落とす
  function rollTalent() {
    const r = (Math.random() + Math.random()) / 2; // 中央寄り
    return +(TALENT_MIN + r * (TALENT_MAX - TALENT_MIN)).toFixed(2);
  }

  // 運の値(0〜1) : ガチャテーブルの重みをこの値でシフトさせる基礎乱数
  function rollLuck() {
    return Math.random();
  }

  // 運の値が高いほど上位ランクの重みが増すよう補正して1回抽選
  function rollGear(luck) {
    const boosted = GEAR_TABLE.map((g, i) => {
      // luckが高いほど上位ランク(配列後方)の重みを増幅
      const boost = 1 + luck * i * 1.8;
      return { ...g, w: g.weight * boost };
    });
    const total = boosted.reduce((s, g) => s + g.w, 0);
    let r = Math.random() * total;
    for (const g of boosted) {
      if (r < g.w) return g;
      r -= g.w;
    }
    return boosted[0];
  }

  /* =========================================================
   * ステージ構成
   * 各ブロック = 通常面2 + 中ボス1(計3面)→ 大ボス、を3ブロック繰り返し、
   * 最後に魔王。仕様書の「3面ごとに大ボス」「各面の最後に中ボス」を
   * 素直に読むと、ブロック内3面目が中ボス格上げ面という解釈になるため、
   * MVP(#1)で一度落としてしまった中ボス階層をここで復元した。
   * ========================================================= */
  function buildStageSequence() {
    const seq = [];
    let n = 0;
    for (let block = 1; block <= 3; block++) {
      for (let i = 0; i < 2; i++) {
        n++;
        seq.push({ label: `第${n}面`, type: "normal", timeLimit: 3, hpBase: 10 + (n - 1) * 2.2 });
      }
      n++;
      seq.push({ label: `第${n}面(中ボス)`, type: "mid", timeLimit: 5, hpBase: 45 + block * 18 });
      seq.push({ label: `大ボス${block}`, type: "big", timeLimit: 8, hpBase: 70 + block * 35 });
    }
    seq.push({ label: "魔王", type: "demon", timeLimit: 10, hpBase: 520 });
    return seq;
  }

  const ENEMY_ICONS = { normal: "👺", mid: "👹", big: "🐗", demon: "🐉" };
  const ENEMY_LABEL_PREFIX = { normal: "雑魚", mid: "中ボス", big: "大ボス", demon: "魔王" };

  /* =========================================================
   * 勝敗判定(★演出のための忖度をしない・純粋計算)
   * ========================================================= */
  const BASE_ATK = 8;      // 秒間基礎攻撃力
  const BASE_HP = 20;      // 敵HP基礎値の係数
  const BASE_EXP_PER_STAGE = 10;

  function computeHeroDps(level, gear) {
    // レベルは才能(経験値倍率)の結果として上がる → レベル依存の攻撃力上昇
    const levelMul = 1 + (level - 1) * 0.22;
    return BASE_ATK * levelMul * gear.atkMul;
  }

  /* =========================================================
   * 状態
   * ========================================================= */
  let state = null;

  function newRunState() {
    const talent = rollTalent();
    const luck = rollLuck();
    return {
      talent, luck,
      level: 1, exp: 0, expToNext: 20,
      gear: GEAR_TABLE[0], // 初期はコモン
      stages: buildStageSequence(),
      stageIndex: 0,
      reachedLabel: "開始前",
      lastCause: null,
      cleared: false,
    };
  }

  /* =========================================================
   * DOM refs
   * ========================================================= */
  const $ = (id) => document.getElementById(id);
  const startScreen = $("start-screen");
  const battleScreen = $("battle-screen");
  const resultScreen = $("result-screen");
  const stageLabel = $("stage-label");
  const timerBar = $("timer-bar");
  const heroHp = $("hero-hp");
  const enemyHp = $("enemy-hp");
  const enemyTag = $("enemy-tag");
  const enemyIcon = $("enemy-icon");
  const heroHit = $("hero-hit");
  const enemyHit = $("enemy-hit");
  const heroAura = $("hero-aura");
  const heroGearIcon = $("hero-gear-icon");
  const statTalent = $("stat-talent");
  const statLuck = $("stat-luck");
  const statLevel = $("stat-level");
  const statGear = $("stat-gear");

  const AURA_COLOR = { common: "transparent", rare: "#5dd9ff", epic: "#c77dff", legend: "#ffd166" };
  const RANK_CLASS = { common: "rank-common", rare: "rank-rare", epic: "rank-epic", legend: "rank-legend" };
  // ⑤ 視覚デザイン(仮): 装備の「有無・グレード」を武器アイコンでも表現する。
  // オーラの色差はスマホの屋外・明所だと視認しづらいため、形状で見分けが
  // つく武器アイコンを併用する。コモンは「素手」= 装備なしをそのまま表す。
  const GEAR_ICON = { common: "", rare: "🗡️", epic: "⚔️", legend: "👑" };

  function updateHud() {
    statTalent.textContent = state.talent.toFixed(2) + "x";
    statLuck.textContent = (state.luck * 100).toFixed(0);
    statLevel.textContent = state.level;
    statGear.textContent = state.gear.rank;
    statGear.className = RANK_CLASS[state.gear.key];
    heroAura.style.background = AURA_COLOR[state.gear.key];
    heroAura.style.opacity = state.gear.key === "common" ? 0 : 0.55;
    heroGearIcon.textContent = GEAR_ICON[state.gear.key];
  }

  function gainExp(amount) {
    state.exp += amount * state.talent;
    while (state.exp >= state.expToNext) {
      state.exp -= state.expToNext;
      state.level++;
      state.expToNext = Math.round(state.expToNext * 1.35);
    }
  }

  function maybeDropGear() {
    const dropped = rollGear(state.luck);
    const currentRankIndex = GEAR_TABLE.findIndex((g) => g.key === state.gear.key);
    const droppedIndex = GEAR_TABLE.findIndex((g) => g.key === dropped.key);
    if (droppedIndex > currentRankIndex) {
      state.gear = dropped;
    }
  }

  /* =========================================================
   * バトルシーケンス制御
   * ========================================================= */
  let rafId = null;

  function startGame() {
    state = newRunState();
    updateHud();
    startScreen.style.display = "none";
    resultScreen.style.display = "none";
    battleScreen.style.display = "flex";
    state.stageIndex = 0;
    runStage();
  }

  function runStage() {
    const stage = state.stages[state.stageIndex];
    if (!stage) {
      finishRun(true, null);
      return;
    }

    stageLabel.textContent = stage.label;
    enemyIcon.textContent = ENEMY_ICONS[stage.type];
    enemyTag.textContent = `${ENEMY_LABEL_PREFIX[stage.type]}`;
    enemyHp.style.width = "100%";
    heroHp.style.width = "100%";
    timerBar.style.width = "100%";
    timerBar.style.background = "var(--accent)";
    timerBar.style.transition = "none";
    requestAnimationFrame(() => {
      timerBar.style.transition = `width ${stage.timeLimit}s linear`;
      timerBar.style.width = "0%";
    });

    const dps = computeHeroDps(state.level, state.gear);
    const enemyHpTotal = stage.hpBase;
    const timeToKill = enemyHpTotal / dps; // 秒
    const willClear = timeToKill <= stage.timeLimit;

    // ④ ペーシング(仮): 面の尺が長いほど手数を増やし、終盤ほど畳みかける
    // ような密度にする。中ボス以降は「攻防の応酬」に見せるため、勇者側の
    // モーションも(実際にはダメージを受けないが)交互に挟む。
    const HIT_INTERVAL_BY_TYPE = { normal: 260, mid: 230, big: 200, demon: 170 };
    const hitInterval = HIT_INTERVAL_BY_TYPE[stage.type] || 260;
    const totalDurationMs = stage.timeLimit * 1000;
    const startTime = performance.now();
    let hitCount = 0;
    let dangerTriggered = false;

    function frame(now) {
      const elapsed = now - startTime;
      const displayElapsed = Math.min(elapsed, totalDurationMs);
      const progressToKill = Math.min(displayElapsed / (timeToKill * 1000), 1);
      enemyHp.style.width = `${Math.max(0, (1 - progressToKill) * 100)}%`;

      const currentHit = Math.floor(elapsed / hitInterval);
      if (currentHit !== hitCount) {
        hitCount = currentHit;
        // 偶数打目は勇者側のモーションを挟み、攻防の応酬に見せる。
        // アニメーション時間はヒット間隔より必ず短くし、次のヒットが
        // 来る前に完走させる(#17: 魔王戦の高速ヒットでの重なり対策)。
        pulse(hitCount % 2 === 0 ? heroHit : enemyHit, Math.min(hitInterval * 0.85, 350));
      }

      // 残り時間が少なく、まだ倒しきれていない場合はタイマーを警告色にする
      if (!dangerTriggered && !willClear && displayElapsed / totalDurationMs > 0.7) {
        dangerTriggered = true;
        timerBar.style.background = "var(--hp)";
      }

      if (willClear && progressToKill >= 1) {
        // 倒しきった → クリア処理へ
        gainExp(BASE_EXP_PER_STAGE * (stage.type === "normal" ? 1 : stage.type === "big" ? 3 : stage.type === "demon" ? 6 : 2));
        maybeDropGear();
        updateHud();
        state.reachedLabel = stage.label;
        state.stageIndex++;
        setTimeout(runStage, 250);
        return;
      }

      if (!willClear && displayElapsed >= totalDurationMs) {
        // タイムアップ → 敗北
        state.reachedLabel = stage.label;
        state.lastCause = pickLossCause();
        finishRun(false, stage);
        return;
      }

      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
  }

  function pulse(el, durationMs) {
    el.classList.remove("show");
    void el.offsetWidth;
    if (durationMs) {
      el.style.setProperty("--hitfx-dur", `${durationMs}ms`);
    }
    el.classList.add("show");
  }

  /* =========================================================
   * ② 敗北演出(仮 — 敗因×面の組み合わせテキスト)
   * ========================================================= */
  function pickLossCause() {
    // 才能・運のどちらが足を引っ張ったかをざっくり判定
    const talentScore = (state.talent - TALENT_MIN) / (TALENT_MAX - TALENT_MIN);
    if (talentScore < 0.35 && state.luck < 0.35) {
      return "both";
    }
    return talentScore <= state.luck ? "talent" : "luck";
  }

  // 面タイプ(normal/big/demon)×敗因(talent/luck/both)の組み合わせテキスト。
  // 「今回はこういう運命だった」と納得させる質を狙い、Shorts的などうでもよさにしない。
  const LOSS_TEXTS = {
    normal: {
      talent: [
        "駆け出しの雑魚相手にすら、成長が追いつかなかった。幸先の悪い運命だった。",
        "才能の伸びが鈍く、序盤の敵にすら手こずったまま終わった。",
      ],
      luck: [
        "ろくな装備も引けないまま、序盤の敵に沈んだ。運に見放された滑り出し。",
        "装備が育つ前に、呆気なく終わってしまった。",
      ],
      both: [
        "才能も運も味方せず、雑魚相手にすらなすすべがなかった。大ハズレの運命。",
      ],
    },
    mid: {
      talent: [
        "中ボスの壁を前に、成長がわずかに足りなかった。",
        "レベルアップの伸びが鈍く、中ボスを崩しきれなかった。",
      ],
      luck: [
        "中ボス戦を前に、装備がもう一段育たなかった。",
        "運が向かないまま、中ボスに時間切れを告げられた。",
      ],
      both: [
        "才能も運も噛み合わず、中ボスの壁に阻まれた。",
      ],
    },
    big: {
      talent: [
        "大ボスの猛攻に、成長速度が最後まで追いつかなかった。",
        "レベルは上がっていたが、大ボスの壁を越えるには足りなかった。",
      ],
      luck: [
        "大ボスを前に、装備の運が最後まで開花しなかった。",
        "もう一段上の装備さえ引ければ……という所で、運が尽きた。",
      ],
      both: [
        "才能も運も噛み合わないまま、大ボスの壁に阻まれた。",
      ],
    },
    demon: {
      talent: [
        "魔王の間合いにまで辿り着きながら、才能の伸びがわずかに足りなかった。惜しい運命だった。",
        "あと少しレベルが高ければ——そう思わせる形で、魔王に届かなかった。",
      ],
      luck: [
        "魔王の一歩手前まで来ながら、最後の装備運に見放された。",
        "ここまで来られたのは大したものだが、運が最後の一押しをくれなかった。",
      ],
      both: [
        "魔王の前に立ちながら、才能にも運にも見放された。それでもここまで来られたのは事実だ。",
      ],
    },
  };

  const RARITY_BY_STAGE_TYPE = {
    normal: { label: "大ハズレ", note: "序盤で力尽きた回。次はもう少し粘れるはず。" },
    mid: { label: "ハズレ", note: "中ボスで力尽きた回。もう一押し欲しかった。" },
    big: { label: "普通", note: "大ボスの壁で力尽きた回。まずまずの結果。" },
    demon: { label: "レア", note: "魔王の前まで辿り着いた回。かなりの当たり枠。" },
  };
  const RARITY_CLEARED = { label: "激レア", note: "魔王を撃破した、最高の運命。" };

  /* =========================================================
   * ③ 収集要素(仮 — 自己ベスト1件のみを保持する最小構成)
   *
   * 仕様書②で「過去のプレイ記録を残すと振り返り行為自体が新たな時間泥棒に
   * なりうる」と指摘されているため、全プレイの履歴ログは意図的に持たせない。
   * 「直近の自己ベスト1件」だけを localStorage に保持し、スクロールして
   * 見返せるような一覧は作らない設計にした。これは仮の判断であり、
   * 実際の使われ方を見て要否を再検討する。
   * ========================================================= */
  const BEST_RECORD_KEY = "1min-hero-best-record-v1";
  const RARITY_RANK = { normal: 0, mid: 1, big: 2, demon: 3, cleared: 4 };
  const RARITY_LABEL_TEXT = { normal: "大ハズレ", mid: "ハズレ", big: "普通", demon: "レア", cleared: "激レア" };

  function loadBestRecord() {
    try {
      const raw = localStorage.getItem(BEST_RECORD_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function renderBestRecord() {
    const best = loadBestRecord();
    const el = $("best-record");
    if (!best) {
      el.textContent = "まだ記録なし。最初の運命を引いてみよう。";
      return;
    }
    el.innerHTML = `自己ベスト: <b>${best.label}</b>(${best.reachedLabel})`;
  }

  function saveBestRecordIfBetter(rankKey, reachedLabel) {
    const rank = RARITY_RANK[rankKey];
    const best = loadBestRecord();
    const isNewBest = !best || rank > best.rank;
    if (isNewBest) {
      try {
        localStorage.setItem(
          BEST_RECORD_KEY,
          JSON.stringify({ rank, label: RARITY_LABEL_TEXT[rankKey], reachedLabel })
        );
      } catch (e) {
        // localStorage が使えない環境ではベスト記録機能を静かに諦める
      }
    }
    return isNewBest;
  }

  function finishRun(cleared, failedStage) {
    cancelAnimationFrame(rafId);
    battleScreen.style.display = "none";
    resultScreen.style.display = "flex";

    const title = $("result-title");
    const detail = $("result-detail");
    const stats = $("result-stats");
    const rarity = $("result-rarity");
    const newBestTag = $("new-best-tag");

    let isNewBest;
    if (cleared) {
      title.textContent = "世界は救われた";
      detail.textContent = "魔王を打ち倒し、1分で世界を救った。今回は最高の運命だった。";
      rarity.textContent = `【${RARITY_CLEARED.label}】${RARITY_CLEARED.note}`;
      isNewBest = saveBestRecordIfBetter("cleared", "魔王撃破");
    } else {
      const causeTexts = LOSS_TEXTS[failedStage.type][state.lastCause];
      const text = causeTexts[Math.floor(Math.random() * causeTexts.length)];
      const r = RARITY_BY_STAGE_TYPE[failedStage.type];
      title.textContent = `${state.reachedLabel}で力尽きた`;
      detail.textContent = text;
      rarity.textContent = `【${r.label}】${r.note}`;
      isNewBest = saveBestRecordIfBetter(failedStage.type, state.reachedLabel);
    }
    newBestTag.style.display = isNewBest ? "block" : "none";

    stats.textContent = `才能 ${state.talent.toFixed(2)}x / 運 ${(state.luck * 100).toFixed(0)} / Lv${state.level} / 最終装備:${state.gear.rank}`;
  }

  $("start-btn").addEventListener("click", startGame);
  $("retry-btn").addEventListener("click", startGame);
  renderBestRecord();
})();
</script>
</body>
</html>
