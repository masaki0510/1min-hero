    --bg: #0f1020;
    --panel: #1a1b32;
    --accent: #ffd166;
    --hp: #ff5d5d;
    --exp: #5dd9ff;
    --text: #eef0ff;
    --common: #9aa0b0;
    --rare: #5dd9ff;
    --epic: #c77dff;
    --legend: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  #app {
    width: 100%; height: 100vh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
    position: relative;
  }

  /* --- Start screen --- */
  #start-screen, #result-screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 24px; text-align: center; z-index: 10;
    background: var(--bg);
  }
  h1 { font-size: 1.6em; margin: 0; letter-spacing: 0.05em; }
  .sub { color: #9aa0c0; font-size: 0.9em; margin-top: -12px; }
  #best-record { color: #8b90b8; font-size: 0.8em; }
  #best-record b { color: var(--accent); }
  #new-best-tag {
    display: none; color: var(--accent); font-size: 0.85em; font-weight: bold;
    margin-top: -8px;
  }
  button.primary {
    background: var(--accent); color: #2a1d00; border: none;
    padding: 14px 36px; font-size: 1.1em; border-radius: 999px;
    font-weight: bold; cursor: pointer;
  }
  button.primary:active { transform: scale(0.97); }

  /* --- Battle screen --- */
  #battle-screen { flex: 1; display: none; flex-direction: column; padding: 16px; }
  #stage-label { text-align: center; font-size: 0.95em; color: #cfd3ff; height: 1.4em; }
  /* #34: 面タイプによる背景切り替え。通常/中ボス/大ボスの道中はkusa.png、
     魔王戦のみmao.pngにして異なる緊張感を出す。単一HTML方針のため
     base64インライン化(圧縮・640px幅リサイズ済み、2枚合計で約90KB)。 */
  #arena {
    flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px; overflow: hidden;
    background-image: var(--bg-kusa);
    background-size: cover; background-position: center bottom;
  }
  #arena.bg-demon { background-image: var(--bg-mao); }
  /* 背景画像の上に敵HPバー等の視認性を保つため、うっすら暗幕をかける */
  #arena::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,16,32,0.35), rgba(15,16,32,0.55));
    pointer-events: none;
  }
  /* #55: 開始直後、才能・運の組み合わせ(=今回の運命)をひと目で
     伝える一瞬のフラッシュ。#30でエンディング側に付けた遷移演出と
     対になる「始まり側」の演出。装備レアリティと同じ色の語彙
     (コモン〜レジェンダリー)を流用し、運が良いほど明るく煌めく。 */
  .fate-flash {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    opacity: 0;
  }
  /* ⑬ 地面のスクロールで「前に進んでいる」実感を常時出す。
     大きなカメラ演出は避け、控えめな並進表現に留める。 */
  #ground {
    position: absolute; left: 0; right: 0; bottom: 14px; height: 2px;
    background-image: repeating-linear-gradient(90deg, #33345a 0 16px, transparent 16px 32px);
    background-size: 32px 2px;
    animation: ground-scroll 1s linear infinite;
  }
  @keyframes ground-scroll {
    from { background-position-x: 0; }
    to { background-position-x: -32px; }
  }
  .fighter { position: relative; width: 90px; text-align: center; }
  #hero { position: absolute; left: 18%; bottom: 20px; }
  #enemy { position: absolute; right: 18%; bottom: 20px; }
  #enemy.enter { animation: enemy-enter 0.35s ease-out; }
  @keyframes enemy-enter {
    0% { transform: translateX(50px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }
  #enemy.exit { animation: enemy-exit 0.22s ease-in forwards; }
  @keyframes enemy-exit {
    0% { transform: translateX(0); opacity: 1; }
    100% { transform: translateX(-50px); opacity: 0; }
  }
  .aura {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 100px; border-radius: 50%; filter: blur(14px);
    opacity: 0.55; z-index: -1;
  }
  /* #35: レアモブは通常敵と同じ強さのまま(HPは変えない)、見た目と報酬だけで
     「運が良い」ことを伝えるボーナス敵。装備オーラ(#6)と同系統の
     金色オーラ+専用ネームタグ色で見分けられるようにする。 */
  #enemy.rare-mob #enemy-aura { background: var(--legend); opacity: 0.5; }
  .rare-mob-tag { color: var(--legend); font-weight: bold; }
  .stick { font-size: 42px; display: block; animation: idle-bob 1.6s ease-in-out infinite; }
  /* 勇者はドット絵アバターに差し替え(仮運用)。敵は引き続き絵文字のため
     トーンが一致しないのは把握済み。今後、敵側の絵柄方針が決まり次第見直す。 */
  #hero-stick { width: 60px; height: auto; margin: 0 auto; image-rendering: pixelated; }
  @keyframes idle-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  /* ⑮ 勇者の攻撃モーション・敵の被弾リアクション。
     idle-bobと同時に走らせると transform が競合するが、JS側で
     element.animate()(Web Animations API)を使って一時的に上書きする
     ため、ここにCSSアニメーション定義は不要(#29: 対応するキーフレームは
     JS内のHIT_ANIM_KEYFRAMESにまとめてある)。 */
  .gear-icon {
    position: absolute; top: 4px; right: -6px; font-size: 20px;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));
  }
  .name-tag { font-size: 0.7em; color: #aeb4d8; margin-top: 4px; }
  .hpbar-wrap { width: 90px; height: 8px; background: #2a2b48; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .hpbar { height: 100%; background: var(--hp); width: 100%; transition: width 0.25s linear; }
  #hero .hpbar { background: var(--exp); }
  .dmg-fx {
    position: absolute; top: 20%; left: 65%; transform: translate(-50%,-50%);
    font-size: 1em; font-weight: bold; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    opacity: 0; pointer-events: none;
  }
  /* ㉑ クリティカル倍率が高いほど、装備レアリティと同じ色調で目立たせる。
     「運が効く場所」として装備ドロップと視覚的な語彙を揃える狙い。 */
  .dmg-fx.crit-crit1 { color: var(--rare); font-size: 1.15em; }
  .dmg-fx.crit-crit2 { color: var(--epic); font-size: 1.3em; }
  .dmg-fx.crit-crit3 { color: var(--legend); font-size: 1.5em; }
  .dmg-fx.crit-crit4 { color: #ff5d5d; font-size: 1.9em; text-shadow: 0 0 8px rgba(255,93,93,0.9); }
  .crit-fx {
    position: absolute; top: -22px; left: 50%; transform: translate(-50%, 0);
    font-size: 0.95em; font-weight: bold; color: #ff5d5d; white-space: nowrap;
    opacity: 0; pointer-events: none;
    text-shadow: 0 0 8px rgba(255, 93, 93, 0.9);
  }
  .levelup-fx {
    position: absolute; top: -18px; left: 50%; transform: translate(-50%, 0);
    font-size: 0.85em; font-weight: bold; color: var(--legend);
    white-space: nowrap; opacity: 0; pointer-events: none;
    text-shadow: 0 0 6px rgba(255, 209, 102, 0.8);
  }
  /* ⑭ 装備ランクアップ演出。レベルアップ演出(-18px)とかぶらないよう
     さらに上の位置に出す。色は装備ランクに応じてJS側で差し替える。 */
  .gear-toast {
    position: absolute; top: -34px; left: 50%; transform: translate(-50%, 0);
    font-size: 0.8em; font-weight: bold; white-space: nowrap;
    opacity: 0; pointer-events: none;
    text-shadow: 0 0 6px rgba(0,0,0,0.7);
  }
  #status-bar {
    display: flex; justify-content: space-around; font-size: 0.75em; color: #b9bde8;
    padding: 8px 0; border-top: 1px solid #2a2b48;
  }
  #status-bar b { color: var(--text); }
  /* #53: 才能・運が何に効くかを、常時表示の一言ヒントとしてラベルに直接
     添える。チュートリアルやモーダルのような能動的な学習コストを
     強いる形は避け、既存レイアウトに収まる範囲の最小限の説明に留める。 */
  .stat-hint { color: #6f74a0; font-size: 0.9em; }
  #timer-wrap { width: 100%; height: 5px; background: #2a2b48; border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
  #timer-bar { height: 100%; width: 100%; background: var(--accent); transition: width 0.1s linear; }

  /* #30: 勝敗確定→結果画面の遷移演出。派手にしすぎず、クリア/敗北で
     質感を変える(クリアは一瞬明るく、敗北は静かに暗転)。ステージ間の
     横スライド(#13)と同じく、抑えた尺(0.2〜0.55秒)に留める。 */
  #battle-screen.battle-fade-out { animation: battle-fade-out 0.2s ease-in forwards; }
  @keyframes battle-fade-out {
    to { opacity: 0; filter: brightness(0.35); }
  }
  #battle-screen.battle-flash-out { animation: battle-flash-out 0.2s ease-out forwards; }
  @keyframes battle-flash-out {
    0% { opacity: 1; filter: brightness(1); }
    50% { opacity: 1; filter: brightness(1.5); }
    100% { opacity: 0; filter: brightness(1.15); }
  }
  #result-screen.result-enter-defeat { animation: result-fade-in-defeat 0.5s ease-out; }
  @keyframes result-fade-in-defeat {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  #result-screen.result-enter-clear { animation: result-fade-in-clear 0.55s ease-out; }
  @keyframes result-fade-in-clear {
    0% { opacity: 0; background: radial-gradient(circle, rgba(255,209,102,0.35), var(--bg) 70%); }
    100% { opacity: 1; background: var(--bg); }
  }

  /* --- Result screen --- */
  #result-screen { display: none; }
  #result-title { font-size: 1.5em; font-weight: bold; }
  #result-rarity { font-size: 0.9em; color: var(--accent); font-weight: bold; }
  #result-detail { color: #cfd3ff; font-size: 0.95em; line-height: 1.6; max-width: 340px; }
  #result-stats { font-size: 0.8em; color: #8b90b8; }
  /* #52: 魔王撃破(激レア)のみ、敗北画面と見分けがつく専用の演出を足す。
     ①常時表示バッジ(👑)②戴冠のような登場モーション③淡く残り続ける
     金色の後光、の3点に絞り、CLAUDE.mdの「派手な演出より静かな達成感」
     の原則を踏まえて過剰な演出は避ける(新規画面や長い専用アニメーション
     は追加しない)。 */
  #result-badge { display: none; font-size: 2.4em; margin-bottom: -8px; }
  #result-screen.cleared #result-badge { display: block; }
  #result-screen.cleared {
    background: radial-gradient(circle at 50% 30%, rgba(255,209,102,0.16), var(--bg) 75%);
  }
  .rank-common { color: var(--common); }
  .rank-rare { color: var(--rare); }
  .rank-epic { color: var(--epic); }
  .rank-legend { color: var(--legend); }
</style>
</head>

<script>
(function () {
  "use strict";

  /* =========================================================
   * ① 確率設計(仮値 — 実プレイで調整する前提)
   * ========================================================= */
  const TALENT_MIN = 0.5, TALENT_MAX = 3.0; // 経験値倍率レンジ
  const GEAR_TABLE = [
    { rank: "コモン",       key: "common", weight: 70, atkMul: 1.00 },
    { rank: "レア",         key: "rare",   weight: 20, atkMul: 1.3  },
    { rank: "エピック",     key: "epic",   weight: 8,  atkMul: 1.7  },
    { rank: "レジェンダリー", key: "legend", weight: 2,  atkMul: 2.4  },
  ];

  // 山型分布(三角分布)で 0.5〜3.0 の間に才能を落とす
  function rollTalent() {
    const r = (Math.random() + Math.random()) / 2; // 中央寄り
    return +(TALENT_MIN + r * (TALENT_MAX - TALENT_MIN)).toFixed(2);
  }

  // 運の値(0〜1) : ガチャテーブルの重みをこの値でシフトさせる基礎乱数
  function rollLuck() {
    return Math.random();
  }

  /* =========================================================
   * ㉑ 「運が高いほど上位枠を引きやすい」重み付け抽選を装備ガチャと
   * クリティカルの両方で共有する。luckは1プレイ中ずっと一定の値なので、
   * 重み付けテーブルは面ごと・ヒットごとに毎回作り直すのではなく、
   * プレイ開始時に一度だけ構築して使い回す(ヒット単位で毎回オブジェクトを
   * 生成し直すと、特に高速ヒットの魔王戦でGC負荷が無視できなくなるため)。
   * ========================================================= */
  function buildLuckRoller(table, luck) {
    const boosted = table.map((item, i) => ({ ...item, w: item.weight * (1 + luck * i * 1.8) }));
    const total = boosted.reduce((s, item) => s + item.w, 0);
    return { boosted, total };
  }

  function rollFromTable(roller) {
    let r = Math.random() * roller.total;
    for (const item of roller.boosted) {
      if (r < item.w) return item;
      r -= item.w;
    }
    return roller.boosted[roller.boosted.length - 1];
  }

  const CRIT_TABLE = [
    { key: "normal", mult: 1.0, weight: 70 },
    { key: "crit1",  mult: 1.2, weight: 20 },
    { key: "crit2",  mult: 1.5, weight: 7  },
    { key: "crit3",  mult: 2.0, weight: 2.5 },
    { key: "crit4",  mult: 5.0, weight: 0.5 },
  ];

  /* =========================================================
   * #35 運によるレアモブ出現(仮 — 実プレイで頻度調整する前提)
   *
   * ★設計方針: レアモブは通常の敵とHP・強さを変えない「ボーナス敵」に
   * した(HPを上げて強くする案もissueで検討されたが、そちらは
   * 「★勝敗はガチ計算」の原則上、レアモブに遭遇した回だけ不利になり
   * うる。運が良い結果として出てくるものが時にプレイヤーを負けさせる
   * のは、運要素の設計として不誠実。良い運は常に純粋なプラスであるべき、
   * という判断でボーナス敵側を採用した)。
   *
   * 出現対象は通常面(6面/run)のみとし、装備ガチャ・クリティカルと同じ
   * buildLuckRoller/rollFromTableの重み付け抽選を再利用する。運が低くても
   * 完全に0%にはせず(通常面1面あたり10%〜24%)、「何面かに1回出会う」
   * 体感を狙う(tools/balance_simで平均遭遇回数を検証済み)。
   * ========================================================= */
  const RARE_MOB_TABLE = [
    { key: "normal", weight: 90 },
    { key: "rareMob", weight: 10 },
  ];
  const RARE_MOB_EXP_MULT = 2.5; // 経験値ボーナス倍率
  const RARE_MOB_LUCK_BONUS = 0.4; // 装備ドロップ抽選で一時的に運が上振れたように補正する量

  /* =========================================================
   * ステージ構成
   * 各ブロック = 通常面2 + 中ボス1(計3面)→ 大ボス、を3ブロック繰り返し、
   * 最後に魔王。仕様書の「3面ごとに大ボス」「各面の最後に中ボス」を
   * 素直に読むと、ブロック内3面目が中ボス格上げ面という解釈になるため、
   * MVP(#1)で一度落としてしまった中ボス階層をここで復元した。
   *
   * #43: 中ボス2・大ボス1〜3・中ボス3のHPが線形(block*係数)のみだと、
   * 才能によるレベル上昇が常に上回ってしまい、ブロック2・3が実質
   * ノーリスクな「コースティング区間」になっていた(balance_simで
   * 合計敗北率0.37%と判明)。ブロック1(中ボス1・大ボス1)の難度は
   * 「最初の関門」として維持しつつ、ブロック2・3にのみ線形+二次の
   * 追加項を乗せることで、道中にも分散したリスクを作る。
   * ========================================================= */
  function midBossHp(block) {
    return 45 + block * 18 + 18 * (block - 1) + 6 * Math.pow(block - 1, 2);
  }
  function bigBossHp(block) {
    return 70 + block * 35 + 34 * (block - 1) + 12 * Math.pow(block - 1, 2);
  }
  function buildStageSequence() {
    const seq = [];
    let n = 0;
    for (let block = 1; block <= 3; block++) {
      for (let i = 0; i < 2; i++) {
        n++;
        seq.push({ label: `第${n}面`, type: "normal", timeLimit: 3, hpBase: 10 + (n - 1) * 2.2 });
      }
      n++;
      seq.push({ label: `第${n}面(中ボス)`, type: "mid", timeLimit: 5, hpBase: midBossHp(block) });
      seq.push({ label: `大ボス${block}`, type: "big", timeLimit: 8, hpBase: bigBossHp(block) });
    }
    seq.push({ label: "魔王", type: "demon", timeLimit: 10, hpBase: 650 });
    return seq;
  }

  const ENEMY_ICONS = { normal: "👺", mid: "👹", big: "🐗", demon: "🐉" };
  const ENEMY_LABEL_PREFIX = { normal: "雑魚", mid: "中ボス", big: "大ボス", demon: "魔王" };

  /* =========================================================
   * 勝敗判定(★演出のための忖度をしない・純粋計算)
   * ========================================================= */
  const BASE_ATK = 8;      // 秒間基礎攻撃力
  const BASE_HP = 20;      // 敵HP基礎値の係数
  const BASE_EXP_PER_STAGE = 10;

  function computeHeroDps(level, gear) {
    // レベルは才能(経験値倍率)の結果として上がる → レベル依存の攻撃力上昇
    const levelMul = 1 + (level - 1) * 0.22;
    return BASE_ATK * levelMul * gear.atkMul;
  }

  /* =========================================================
   * 状態
   * ========================================================= */
  let state = null;

  function newRunState() {
    const talent = rollTalent();
    const luck = rollLuck();
    return {
      talent, luck,
      // luckは以後このプレイ中ずっと変わらないため、重み付け抽選機は
      // ここで一度だけ構築して使い回す
      gearRoller: buildLuckRoller(GEAR_TABLE, luck),
      critRoller: buildLuckRoller(CRIT_TABLE, luck),
      rareMobRoller: buildLuckRoller(RARE_MOB_TABLE, luck),
      // #35: レアモブ撃破時の装備ドロップは、運が一時的に上振れたかのように
      // 補正したテーブルで抽選する(通常のgearRollerとは別に保持)
      rareMobGearRoller: buildLuckRoller(GEAR_TABLE, Math.min(1, luck + RARE_MOB_LUCK_BONUS)),
      level: 1, exp: 0, expToNext: 20,
      gear: GEAR_TABLE[0], // 初期はコモン
      stages: buildStageSequence(),
      stageIndex: 0,
      reachedLabel: "開始前",
      lastCause: null,
      cleared: false,
      isRareMobStage: false,
    };
  }

  /* =========================================================
   * DOM refs
   * ========================================================= */
  const $ = (id) => document.getElementById(id);
  const startScreen = $("start-screen");
  const battleScreen = $("battle-screen");
  const resultScreen = $("result-screen");
  const resultBadge = $("result-badge");
  const stageLabel = $("stage-label");
  const arena = $("arena");
  const enemyFighter = $("enemy");
  const timerBar = $("timer-bar");
  const heroHp = $("hero-hp");
  const enemyHp = $("enemy-hp");
  const enemyTag = $("enemy-tag");
  const enemyIcon = $("enemy-icon");
  const heroStick = $("hero-stick");
  const enemyDmg = $("enemy-dmg");
  const critFx = $("crit-fx");
  const heroLevelUp = $("hero-levelup");
  const gearToast = $("gear-toast");
  const enemyAura = $("enemy-aura");
  const rareMobToast = $("rare-mob-toast");
  const heroAura = $("hero-aura");
  const heroGearIcon = $("hero-gear-icon");
  const fateFlash = $("fate-flash");
  const statTalent = $("stat-talent");
  const statLuck = $("stat-luck");
  const statLevel = $("stat-level");
  const statGear = $("stat-gear");

  const AURA_COLOR = { common: "transparent", rare: "#5dd9ff", epic: "#c77dff", legend: "#ffd166" };
  const RANK_CLASS = { common: "rank-common", rare: "rank-rare", epic: "rank-epic", legend: "rank-legend" };
  // #55: 開始直後のフラッシュ用。装備レアリティと同じ4段階の色語彙を、
  // 才能・運という「今回の運命」そのものにも適用する。AURA_COLORのcommonは
  // 装備なし=transparentだが、こちらは常に何かしら見える必要があるため
  // 別テーブルとして持つ。
  const FATE_FLASH_COLOR = {
    common: "rgba(154,160,176,0.28)",
    rare: "rgba(93,217,255,0.32)",
    epic: "rgba(199,125,255,0.32)",
    legend: "rgba(255,209,102,0.4)",
  };
  // 才能・運を均等加重で平均し、装備ガチャと同じ4段階に割り付ける
  function fateQualityKey(talent, luck) {
    const talentNorm = (talent - TALENT_MIN) / (TALENT_MAX - TALENT_MIN);
    const quality = (talentNorm + luck) / 2;
    if (quality >= 0.75) return "legend";
    if (quality >= 0.5) return "epic";
    if (quality >= 0.25) return "rare";
    return "common";
  }
  // ⑤ 視覚デザイン(仮): 装備の「有無・グレード」を武器アイコンでも表現する。
  // オーラの色差はスマホの屋外・明所だと視認しづらいため、形状で見分けが
  // つく武器アイコンを併用する。コモンは「素手」= 装備なしをそのまま表す。
  const GEAR_ICON = { common: "", rare: "🗡️", epic: "⚔️", legend: "👑" };

  function updateHud() {
    statTalent.textContent = state.talent.toFixed(2) + "x";
    statLuck.textContent = (state.luck * 100).toFixed(0);
    statLevel.textContent = state.level;
    statGear.textContent = state.gear.rank;
    statGear.className = RANK_CLASS[state.gear.key];
    heroAura.style.background = AURA_COLOR[state.gear.key];
    heroAura.style.opacity = state.gear.key === "common" ? 0 : 0.55;
    heroGearIcon.textContent = GEAR_ICON[state.gear.key];
    updateExpGauge();
  }

  // ⑲ 勇者側のバーは「HP」ではなく次のレベルアップまでの経験値ゲージとして扱う。
  // このゲームは勇者がダメージを受けない一方的な計算モデルのため、常に満タンな
  // 偽HPバーを表示するより、実データ(経験値の伸び)を見せた方が情報として誠実。
  function updateExpGauge() {
    const ratio = Math.min(1, state.exp / state.expToNext);
    heroHp.style.width = `${ratio * 100}%`;
  }

  function gainExp(amount) {
    state.exp += amount * state.talent;
    let leveledUp = false;
    while (state.exp >= state.expToNext) {
      state.exp -= state.expToNext;
      state.level++;
      state.expToNext = Math.round(state.expToNext * 1.35);
      leveledUp = true;
    }
    return leveledUp;
  }

  function maybeDropGear(roller) {
    const dropped = rollFromTable(roller || state.gearRoller);
    const currentRankIndex = GEAR_TABLE.findIndex((g) => g.key === state.gear.key);
    const droppedIndex = GEAR_TABLE.findIndex((g) => g.key === dropped.key);
    if (droppedIndex > currentRankIndex) {
      state.gear = dropped;
      return dropped;
    }
    return null;
  }

  /* =========================================================
   * バトルシーケンス制御
   * ========================================================= */
  let rafId = null;

  // #55: #30でエンディング側(勝敗確定→結果画面)には遷移演出を足したが、
  // 対になる「始まりの瞬間」(タップ→ガチャ結果が決まった瞬間)には何も
  // 演出がなく、才能・運という「今回の運命」を噛みしめる間がなかった。
  // ステータスバーの数値表示はそのまま(#53)残しつつ、アリーナ全体を
  // 一瞬だけ運命の質に応じた色でフラッシュさせ、バトル開始を少し遅らせる。
  const FATE_REVEAL_MS = 450;

  function startGame() {
    state = newRunState();
    updateHud();
    startScreen.style.display = "none";
    resultScreen.style.display = "none";
    battleScreen.style.display = "flex";
    state.stageIndex = 0;
    showFateReveal();
    setTimeout(runStage, FATE_REVEAL_MS);
  }

  function showFateReveal() {
    const key = fateQualityKey(state.talent, state.luck);
    fateFlash.style.background = `radial-gradient(circle, ${FATE_FLASH_COLOR[key]}, transparent 70%)`;
    pulse(fateFlash, FATE_REVEAL_MS, "fateFlash");
  }

  function runStage() {
    const stage = state.stages[state.stageIndex];
    if (!stage) {
      finishRun(true, null);
      return;
    }

    stageLabel.textContent = stage.label;
    // #34: 道中(通常/中ボス/大ボス)はkusa.png、魔王戦のみmao.pngに切り替える
    arena.classList.toggle("bg-demon", stage.type === "demon");
    // #35: レアモブは通常面のみ抽選対象(中ボス・大ボス・魔王は面それぞれの
    // 個性を保ちたいため対象外)
    state.isRareMobStage = stage.type === "normal" && rollFromTable(state.rareMobRoller).key === "rareMob";
    enemyIcon.textContent = ENEMY_ICONS[stage.type];
    enemyTag.textContent = state.isRareMobStage ? "レアモブ" : `${ENEMY_LABEL_PREFIX[stage.type]}`;
    enemyTag.className = state.isRareMobStage ? "name-tag rare-mob-tag" : "name-tag";
    enemyFighter.classList.toggle("rare-mob", state.isRareMobStage);
    if (state.isRareMobStage) showRareMobToast();
    enemyHp.style.width = "100%";
    // ⑬ 新しい敵を右からスライドインさせ、面が進んでいる実感を出す
    enemyFighter.classList.remove("exit");
    void enemyFighter.offsetWidth;
    enemyFighter.classList.add("enter");
    // 勇者側のバーは「HP」ではなく経験値ゲージ(#19)なので面開始時にリセットしない
    timerBar.style.width = "100%";
    timerBar.style.background = "var(--accent)";
    timerBar.style.transition = "none";
    requestAnimationFrame(() => {
      timerBar.style.transition = `width ${stage.timeLimit}s linear`;
      timerBar.style.width = "0%";
    });

    const dps = computeHeroDps(state.level, state.gear);
    const enemyHpTotal = stage.hpBase;

    // ④ ペーシング(仮): 面の尺が長いほど手数を増やし、終盤ほど畳みかける
    // ような密度にする。中ボス以降は「攻防の応酬」に見せるため、勇者側の
    // モーションも(実際にはダメージを受けないが)交互に挟む。
    const HIT_INTERVAL_BY_TYPE = { normal: 260, mid: 230, big: 200, demon: 170 };
    const hitInterval = HIT_INTERVAL_BY_TYPE[stage.type] || 260;
    const totalDurationMs = stage.timeLimit * 1000;
    const startTime = performance.now();
    let hitCount = 0;
    let dangerTriggered = false;
    let dealtDamage = 0;
    // ㉑ クリティカルの導入により、1ヒットの実ダメージはもう「事前に決まった
    // 一定値」ではなく毎ヒット乱数で決まる。そのため勝敗も面開始時の事前計算
    // ではなく、実際に積み上がったダメージが制限時間内に敵HPへ届いたかどうかで
    // その場で判定する(★演出のための忖度をしない、をより徹底した形)。
    const baseDamagePerHit = dps * (hitInterval / 1000);

    function frame(now) {
      const elapsed = now - startTime;
      const displayElapsed = Math.min(elapsed, totalDurationMs);

      const currentHit = Math.floor(elapsed / hitInterval);
      if (currentHit !== hitCount) {
        hitCount = currentHit;
        const crit = rollFromTable(state.critRoller);
        const hitDamage = baseDamagePerHit * crit.mult;
        dealtDamage = Math.min(enemyHpTotal, dealtDamage + hitDamage);
        enemyHp.style.width = `${Math.max(0, (1 - dealtDamage / enemyHpTotal) * 100)}%`;

        const shownDamage = Math.max(1, Math.round(hitDamage));
        enemyDmg.textContent = `-${shownDamage}`;
        enemyDmg.className = `dmg-fx ${crit.mult > 1 ? "crit-" + crit.key : ""}`;
        const fxDuration = Math.min(hitInterval * 0.85, 350);
        pulse(enemyDmg, fxDuration, "dmgPop");
        // #28: 以前はここで「!」ポップ(hit-fx)を勇者/敵に交互表示していたが、
        // このゲームは勇者がダメージを受けない一方的な計算モデルのため、
        // 勇者側に「!」が出ると実際には起きていないことを示唆し誤解を招く。
        // dmg-fx(ダメージ数値)がすでに「ヒットが発生した」情報を数値付きで
        // 伝えており、hit-fxは情報として重複していたため廃止した。
        // ⑮ 実際のダメージは毎ヒット発生するため、勇者の振りかぶり・
        // 敵の被弾リアクションは毎ヒット発火する。
        pulse(heroStick, fxDuration, "heroSwing");
        pulse(enemyIcon, fxDuration, "enemyFlinch");
        // ㉑ 最上位クリティカル(5倍)だけは「会心の一撃!」として特別扱いする
        if (crit.mult >= 5) showCritical();
      }

      // ㉑ 残り時間に対して敵HPの減りが追いついていない(このままのペースでは
      // 間に合わない)場合にタイマーを警告色にする。事前計算の結果ではなく、
      // その場その場の実際の進み具合で判定するため、クリティカル運次第で
      // 警告が出たり出なかったりする。
      const remainingTimeFraction = 1 - displayElapsed / totalDurationMs;
      const remainingHpFraction = 1 - dealtDamage / enemyHpTotal;
      if (!dangerTriggered && remainingTimeFraction < 0.3 && remainingHpFraction > remainingTimeFraction) {
        dangerTriggered = true;
        timerBar.style.background = "var(--hp)";
      }

      if (dealtDamage >= enemyHpTotal) {
        // 倒しきった → クリア処理へ
        const baseExp = BASE_EXP_PER_STAGE * (stage.type === "normal" ? 1 : stage.type === "big" ? 3 : stage.type === "demon" ? 6 : 2);
        // #35: レアモブは経験値ボーナス+装備ドロップ抽選の運を一時的に上振れさせる
        const leveledUp = gainExp(state.isRareMobStage ? baseExp * RARE_MOB_EXP_MULT : baseExp);
        const upgradedGear = maybeDropGear(state.isRareMobStage ? state.rareMobGearRoller : state.gearRoller);
        updateHud();
        if (leveledUp) showLevelUp();
        if (upgradedGear) showGearUpgrade(upgradedGear);
        else showGearWhiff();
        // ⑬ 倒した敵を左に退場させてから次の敵を呼び込む
        enemyFighter.classList.remove("enter");
        void enemyFighter.offsetWidth;
        enemyFighter.classList.add("exit");
        state.reachedLabel = stage.label;
        state.stageIndex++;
        setTimeout(runStage, 250);
        return;
      }

      if (displayElapsed >= totalDurationMs) {
        // タイムアップ → 敗北
        state.reachedLabel = stage.label;
        state.lastCause = pickLossCause();
        finishRun(false, stage);
        return;
      }

      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
  }

  // ⑱ レベルアップの瞬間だけは、成長の手応えとして目立つ演出を入れる。
  // 頻繁に起きるヒット演出とは別枠にし、控えめな他の演出とのメリハリをつける。
  function showLevelUp() {
    pulse(heroLevelUp, 900, "levelupPop");
  }

  // ㉑ 最上位クリティカル(5倍)だけの特別演出。装備のレジェンダリー同様、
  // 最も重み(確率)が低い枠なので、専用の派手さで「引いた」感を出す。
  function showCritical() {
    pulse(critFx, 700, "critPop");
  }

  // ⑭ 装備がランクアップした瞬間だけ演出する。ランクアップしなかった
  // ドロップ(据え置き)は静かに処理し、「毎回同じ強い演出」で摩耗させない。
  function showGearUpgrade(gear) {
    gearToast.textContent = `装備ドロップ! ${gear.rank}を手に入れた`;
    gearToast.className = `gear-toast ${RANK_CLASS[gear.key]}`;
    pulse(gearToast, 1000, "levelupPop");
    pulse(heroGearIcon, 500, "gearBounce");
    pulse(heroAura, 600, "auraFlash");
  }

  // #54: 装備ドロップ抽選は面クリアのたびに毎回行われているが、現在ランクを
  // 超えなかった(据え置きだった)場合は従来なにも起きず、プレイヤーには
  // ガチャを引いたことすら伝わらなかった。装備アイコン(heroGearIcon)は
  // コモン装備時は空文字で非表示になるため対象にできず、代わりに常に
  // 文字が表示されているステータスバーの「装備」表記を、アップグレード時の
  // 派手な演出(gearBounce・トースト・オーラフラッシュ)とはっきり差がつく、
  // ごく控えめな一瞬の沈み込みだけで知らせる(#28で戒めた情報過多を
  // 再発させないため、面クリア時のみ・要素1つだけに絞る)。
  function showGearWhiff() {
    pulse(statGear, 300, "gearWhiff");
  }

  // #35: レアモブ出現の瞬間だけ演出する。経験値・装備ドロップのボーナスは
  // 撃破後に静かに反映されるだけなので、出現時にひと目でわかる合図を出す。
  function showRareMobToast() {
    pulse(rareMobToast, 1000, "levelupPop");
    pulse(enemyAura, 600, "auraFlash");
  }

  // #29: 高速ヒット時(魔王戦は毎秒最大約6ヒット)、1ヒットあたり最大4要素に
  // pulse()を呼ぶと、従来の classList.remove → offsetWidth読み取り(強制
  // リフロー)→ add という実装では強制リフローが多発しメインスレッドを
  // 圧迫していた。Web Animations API の element.animate() はレイアウトを
  // 強制せずに新しいアニメーションインスタンスを生成できるため、同名
  // アニメーションの多重起動(=前のアニメーションのキャンセルと再始動)を
  // 強制リフローなしで行える。
  const HIT_ANIM_KEYFRAMES = {
    dmgPop: [
      { opacity: 1, transform: "translate(-50%,-50%) scale(0.8)", offset: 0 },
      { opacity: 1, transform: "translate(-50%,-90%) scale(1)", offset: 0.5 },
      { opacity: 0, transform: "translate(-50%,-120%) scale(0.95)", offset: 1 },
    ],
    heroSwing: [
      { transform: "translateX(0) rotate(0deg)", offset: 0 },
      { transform: "translateX(10px) rotate(-22deg)", offset: 0.35 },
      { transform: "translateX(0) rotate(0deg)", offset: 1 },
    ],
    enemyFlinch: [
      { transform: "translateX(0) rotate(0deg)", offset: 0 },
      { transform: "translateX(-6px) rotate(6deg)", offset: 0.3 },
      { transform: "translateX(3px) rotate(-3deg)", offset: 0.65 },
      { transform: "translateX(0) rotate(0deg)", offset: 1 },
    ],
    critPop: [
      { opacity: 0, transform: "translate(-50%,6px) scale(0.6) rotate(-4deg)", offset: 0 },
      { opacity: 1, transform: "translate(-50%,-8px) scale(1.25) rotate(3deg)", offset: 0.25 },
      { opacity: 1, transform: "translate(-50%,-8px) scale(1.05) rotate(0deg)", offset: 0.7 },
      { opacity: 0, transform: "translate(-50%,-20px) scale(1) rotate(0deg)", offset: 1 },
    ],
    levelupPop: [
      { opacity: 0, transform: "translate(-50%,10px) scale(0.7)", offset: 0 },
      { opacity: 1, transform: "translate(-50%,-6px) scale(1.1)", offset: 0.2 },
      { opacity: 1, transform: "translate(-50%,-6px) scale(1)", offset: 0.75 },
      { opacity: 0, transform: "translate(-50%,-18px) scale(1)", offset: 1 },
    ],
    gearBounce: [
      { transform: "scale(0.4) rotate(-25deg)", opacity: 0, offset: 0 },
      { transform: "scale(1.4) rotate(8deg)", opacity: 1, offset: 0.5 },
      { transform: "scale(1) rotate(0deg)", opacity: 1, offset: 1 },
    ],
    // #54: アップグレード演出(gearBounce)とはっきり差がつく、地味な一瞬の沈み込みのみ
    gearWhiff: [
      { opacity: 1, offset: 0 },
      { opacity: 0.35, offset: 0.5 },
      { opacity: 1, offset: 1 },
    ],
    // #55: 開始直後の運命フラッシュ。完全な透明から一瞬だけ煌めき、また消える
    fateFlash: [
      { opacity: 0, offset: 0 },
      { opacity: 1, offset: 0.35 },
      { opacity: 0, offset: 1 },
    ],
    // #52: 魔王撃破時の戴冠バッジ。落ちてきて弾む程度に留め、長尺・多重効果は避ける
    crownEnter: [
      { opacity: 0, transform: "translateY(-16px) scale(0.5) rotate(-10deg)", offset: 0 },
      { opacity: 1, transform: "translateY(4px) scale(1.15) rotate(4deg)", offset: 0.6 },
      { opacity: 1, transform: "translateY(0) scale(1) rotate(0deg)", offset: 1 },
    ],
    auraFlash: [
      { opacity: 0.55, filter: "blur(14px)", offset: 0 },
      { opacity: 1, filter: "blur(20px)", offset: 0.4 },
      { opacity: 0.55, filter: "blur(14px)", offset: 1 },
    ],
  };

  function pulse(el, durationMs, kind) {
    if (el._pulseAnim) el._pulseAnim.cancel();
    el._pulseAnim = el.animate(HIT_ANIM_KEYFRAMES[kind], {
      duration: durationMs || 350,
      easing: "ease-out",
      fill: "none",
    });
  }

  /* =========================================================
   * ② 敗北演出(仮 — 敗因×面の組み合わせテキスト)
   * ========================================================= */
  function pickLossCause() {
    // 才能・運のどちらが足を引っ張ったかをざっくり判定
    const talentScore = (state.talent - TALENT_MIN) / (TALENT_MAX - TALENT_MIN);
    if (talentScore < 0.35 && state.luck < 0.35) {
      return "both";
    }
    return talentScore <= state.luck ? "talent" : "luck";
  }

  // 面タイプ(mid/big/demon)×敗因(talent/luck/both)の組み合わせテキスト。
  // 「今回はこういう運命だった」と納得させる質を狙い、Shorts的などうでもよさにしない。
  // ㉓ 通常面(normal)は#27で判明した通り現在のバランスでは理論上敗北不可能
  // (才能・運が最低でも通常面の敵HPを制限時間内に必ず削りきれる)なため、
  // ここには存在しない。中ボスが実質的な最初の関門であり、大ハズレの
  // 運命はここに紐づける(tools/balance_simで約18%がここで脱落することを確認済み)。
  // #43でブロック2・3の中ボス・大ボスにもリスクを持たせたため、「最初の」
  // という限定表現は避け、どのブロックの中ボス/大ボスで負けても違和感のない
  // 汎用的な文言にしている(具体的にどの面かはタイトル側でstate.reachedLabelが示す)。
  const LOSS_TEXTS = {
    mid: {
      talent: [
        "中ボス相手に、成長が追いつかなかった。幸先の悪い運命だった。",
        "レベルアップの伸びが鈍く、中ボスを崩しきれなかった。",
      ],
      luck: [
        "ろくな装備も引けないまま、中ボスに沈んだ。運に見放された展開。",
        "運が向かないまま、中ボスに時間切れを告げられた。",
      ],
      both: [
        "才能も運も味方せず、中ボス相手になすすべがなかった。大ハズレの運命。",
      ],
    },
    big: {
      talent: [
        "大ボスの猛攻に、成長速度が最後まで追いつかなかった。",
        "レベルは上がっていたが、大ボスの壁を越えるには足りなかった。",
      ],
      luck: [
        "大ボスを前に、装備の運が最後まで開花しなかった。",
        "もう一段上の装備さえ引ければ……という所で、運が尽きた。",
      ],
      both: [
        "才能も運も噛み合わないまま、大ボスの壁に阻まれた。",
      ],
    },
    demon: {
      talent: [
        "魔王の間合いにまで辿り着きながら、才能の伸びがわずかに足りなかった。惜しい運命だった。",
        "あと少しレベルが高ければ——そう思わせる形で、魔王に届かなかった。",
      ],
      luck: [
        "魔王の一歩手前まで来ながら、最後の装備運に見放された。",
        "ここまで来られたのは大したものだが、運が最後の一押しをくれなかった。",
      ],
      both: [
        "魔王の前に立ちながら、才能にも運にも見放された。それでもここまで来られたのは事実だ。",
      ],
    },
  };

  const RARITY_BY_STAGE_TYPE = {
    mid: { label: "大ハズレ", note: "中ボスで力尽きた回。次はもう少し粘れるはず。" },
    big: { label: "ハズレ", note: "大ボスの壁で力尽きた回。もう一押し欲しかった。" },
    demon: { label: "普通", note: "魔王の前まで辿り着いた回。まずまずの結果。" },
  };
  const RARITY_CLEARED = { label: "激レア", note: "魔王を撃破した、最高の運命。" };

  /* =========================================================
   * ③ 収集要素(仮 — 自己ベスト1件のみを保持する最小構成)
   *
   * 仕様書②で「過去のプレイ記録を残すと振り返り行為自体が新たな時間泥棒に
   * なりうる」と指摘されているため、全プレイの履歴ログは意図的に持たせない。
   * 「直近の自己ベスト1件」だけを localStorage に保持し、スクロールして
   * 見返せるような一覧は作らない設計にした。これは仮の判断であり、
   * 実際の使われ方を見て要否を再検討する。
   * ========================================================= */
  const BEST_RECORD_KEY = "1min-hero-best-record-v1";
  const RARITY_RANK = { mid: 0, big: 1, demon: 2, cleared: 3 };
  const RARITY_LABEL_TEXT = { mid: "大ハズレ", big: "ハズレ", demon: "普通", cleared: "激レア" };

  function loadBestRecord() {
    try {
      const raw = localStorage.getItem(BEST_RECORD_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function renderBestRecord() {
    const best = loadBestRecord();
    const el = $("best-record");
    if (!best) {
      el.textContent = "まだ記録なし。最初の運命を引いてみよう。";
      return;
    }
    el.innerHTML = `自己ベスト: <b>${best.label}</b>(${best.reachedLabel})`;
  }

  function saveBestRecordIfBetter(rankKey, reachedLabel) {
    const rank = RARITY_RANK[rankKey];
    const best = loadBestRecord();
    const isNewBest = !best || rank > best.rank;
    if (isNewBest) {
      try {
        localStorage.setItem(
          BEST_RECORD_KEY,
          JSON.stringify({ rank, label: RARITY_LABEL_TEXT[rankKey], reachedLabel })
        );
      } catch (e) {
        // localStorage が使えない環境ではベスト記録機能を静かに諦める
      }
    }
    return isNewBest;
  }

  function finishRun(cleared, failedStage) {
    cancelAnimationFrame(rafId);

    const title = $("result-title");
    const detail = $("result-detail");
    const stats = $("result-stats");
    const rarity = $("result-rarity");
    const newBestTag = $("new-best-tag");

    let isNewBest;
    if (cleared) {
      title.textContent = "世界は救われた";
      detail.textContent = "魔王を打ち倒し、1分で世界を救った。今回は最高の運命だった。";
      rarity.textContent = `【${RARITY_CLEARED.label}】${RARITY_CLEARED.note}`;
      isNewBest = saveBestRecordIfBetter("cleared", "魔王撃破");
    } else {
      const causeTexts = LOSS_TEXTS[failedStage.type][state.lastCause];
      const text = causeTexts[Math.floor(Math.random() * causeTexts.length)];
      const r = RARITY_BY_STAGE_TYPE[failedStage.type];
      title.textContent = `${state.reachedLabel}で力尽きた`;
      detail.textContent = text;
      rarity.textContent = `【${r.label}】${r.note}`;
      isNewBest = saveBestRecordIfBetter(failedStage.type, state.reachedLabel);
    }
    newBestTag.style.display = isNewBest ? "block" : "none";

    // #53: 結果を振り返るこの瞬間こそ「なぜこうなったか」の納得感が
    // 最も求められるため、才能・運が何に効くかを一言添える
    stats.textContent = `才能(成長) ${state.talent.toFixed(2)}x / 運(装備) ${(state.luck * 100).toFixed(0)} / Lv${state.level} / 最終装備:${state.gear.rank}`;

    transitionToResult(cleared);
  }

  // #30: 勝敗確定の瞬間は、そのプレイの中で最も感情が動む場面のため、
  // 素っ気ない即時切り替えではなく短い遷移演出を挟む。クリア時は一瞬
  // 明るく光ってから、敗北時は静かに暗転してから結果画面へ。
  // CLAUDE.mdの「派手な演出より静かな達成感」の原則に沿い、尺は
  // 0.2〜0.55秒の範囲に抑えている。
  function transitionToResult(cleared) {
    const exitClass = cleared ? "battle-flash-out" : "battle-fade-out";
    battleScreen.classList.add(exitClass);
    setTimeout(() => {
      battleScreen.style.display = "none";
      battleScreen.classList.remove(exitClass);
      resultScreen.style.display = "flex";
      // #52: 魔王撃破時のみ専用の後光・バッジを出す。resultScreenは
      // run間で使い回すため、敗北時は明示的に外す
      resultScreen.classList.toggle("cleared", cleared);
      const enterClass = cleared ? "result-enter-clear" : "result-enter-defeat";
      resultScreen.classList.add(enterClass);
      resultScreen.addEventListener(
        "animationend",
        () => resultScreen.classList.remove(enterClass),
        { once: true }
      );
      if (cleared) pulse(resultBadge, 700, "crownEnter");
    }, 200);
  }

  $("start-btn").addEventListener("click", startGame);
  $("retry-btn").addEventListener("click", startGame);
  renderBestRecord();
})();
</script>
</body>
</html>
